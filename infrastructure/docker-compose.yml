version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: verified_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verified
      POSTGRES_USER: verified
      POSTGRES_PASSWORD: verified_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verified_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
